name: Finalize LY10 publication hub
on:
  push:
    branches: [ly10-publication-upgrades]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ly10-publication-upgrades
      - name: Finalize homepage publication links and fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<div class="stat-cards"><div><span>GOALS</span><b>18</b><small>2025/26 all competitions</small></div><div><span>ASSISTS</span><b>22</b><small>Creative output</small></div><div><span>CHANCES CREATED</span><b>87</b><small>Season total</small></div><div><span>TAKE-ONS WON</span><b>126</b><small>1v1 moments</small></div></div>','<div class="stat-cards"><div><span>GOALS</span><b>0</b><small>2026/27 La Liga</small></div><div><span>ASSISTS</span><b>0</b><small>2026/27 La Liga</small></div><div><span>MATCHES</span><b>2</b><small>League appearances</small></div><div><span>MINUTES</span><b>155</b><small>League minutes</small></div></div>')
          old='<section class="project-desk section"><div class="section-label">09 / OPEN FAN PROJECT</div><div class="project-grid"><article><h3>START HERE</h3><p>New to LY10? Start with the story, then the match centre, then join the community.</p><a href="#story">BEGIN THE STORY →</a></article><article><h3>PROJECT ROADMAP</h3><p>Next: article archive, moderated fan submissions, fixture-data integration and downloadable wallpapers.</p><a href="roadmap.html">VIEW ROADMAP →</a></article><article><h3>TRANSPARENT BY DESIGN</h3><p>See changes, credits, attribution, privacy notes and source code for this independent fan project.</p><a href="changelog.html">PROJECT CHANGELOG →</a></article><article><h3>NEED TO REPORT SOMETHING?</h3><p>Found an error, broken image or accessibility issue? Let the creator know.</p><a href="https://github.com/pennyattah/Lamine-Yamal-Fanbase/issues/new" target="_blank" rel="noopener">REPORT AN ISSUE ↗</a></article></div><div class="project-links"><a href="privacy.html">Privacy</a><a href="credits.html">Credits &amp; sources</a><a href="https://github.com/pennyattah/Lamine-Yamal-Fanbase" target="_blank" rel="noopener">GitHub</a><a href="mailto:penelopeolapejuattah@gmail.com?subject=LY10%20Fanbase">Email LY10</a><a href="#feedback-form">Feedback</a></div></section>'
          new='<section class="project-desk section"><div class="section-label">09 / LY10 PUBLICATION DESK</div><div class="project-grid"><article><h3>YAMAL TRACKER</h3><p>Verified 2026/27 league appearances, minutes, goals and assists in one dedicated player dashboard.</p><a href="stats.html">OPEN THE TRACKER →</a></article><article><h3>MATCH REPORTS</h3><p>An auto-growing archive of verified Barça results with a focused look at Lamine Yamal’s influence.</p><a href="match-reports.html">READ REPORTS →</a></article><article><h3>BIOGRAPHY &amp; RECORDS</h3><p>From La Masia to Barça No. 10: career milestones, records and honours with source links.</p><a href="biography.html">OPEN THE DOSSIER →</a></article><article><h3>LIVE MATCH CENTRE</h3><p>Latest result, next fixture, countdown, league position and Yamal season snapshot.</p><a href="match-centre.html">OPEN MATCH CENTRE →</a></article></div><div class="project-links"><a href="stats.html">Yamal Tracker</a><a href="match-reports.html">Match Reports</a><a href="biography.html">Biography</a><a href="match-centre.html">Match Centre</a><a href="wallpapers.html">Wallpapers</a><a href="privacy.html">Privacy</a><a href="credits.html">Credits &amp; sources</a><a href="https://github.com/pennyattah/Lamine-Yamal-Fanbase" target="_blank" rel="noopener">GitHub</a><a href="mailto:penelopeolapejuattah@gmail.com?subject=LY10%20Fanbase">Email LY10</a><a href="#feedback-form">Feedback</a></div></section>'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote LY10 publication hub on homepage"
          git push origin HEAD:ly10-publication-upgrades
