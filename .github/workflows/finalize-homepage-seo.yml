name: Finalize LY10 homepage SEO
on:
  push:
    branches: [ly10-publication-upgrades]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ly10-publication-upgrades
      - name: Patch crawler-facing homepage source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<link rel="canonical" href="https://github.io" />','<link rel="canonical" href="https://ly10-fanbase.vercel.app/" />')
          s=s.replace('<meta property="og:url" content="https://github.io" />','<meta property="og:url" content="https://ly10-fanbase.vercel.app/" />')
          s=s.replace('<meta property="og:image" content="https://github.ioassets/preview.jpg" />','<meta property="og:image" content="https://ly10-fanbase.vercel.app/og-card.png" />')
          s=s.replace('<meta name="twitter:image" content="https://github.ioassets/preview.jpg" />','<meta name="twitter:image" content="https://ly10-fanbase.vercel.app/og-card.png" />')
          s=s.replace('    <title>LY10 — Lamine Yamal Fanbase</title>\n','',1)
          s=s.replace('<link rel="icon" type="image/png" sizes="32x32" href="./ly10.png" />','<link rel="icon" type="image/svg+xml" href="./favicon.svg" />')
          s=s.replace('"url":"https://example.github.io/ly10/"','"url":"https://ly10-fanbase.vercel.app/"')
          s=s.replace('LIVE FAN DESK / EDIT AFTER EVERY MATCH','LIVE MATCH DESK / AUTO-UPDATED')
          s=s.replace('PLAYER INTELLIGENCE / EDITABLE FAN DATA','PLAYER INTELLIGENCE / VERIFIED SEASON DATA')
          s=s.replace('Season snapshots, visualized for quick scanning. Replace the figures after every match.','Verified, competition-labelled season data with an auto-updated Yamal tracker.')
          old='<div class="project-links"><a href="privacy.html">Privacy</a><a href="credits.html">Credits &amp; sources</a><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a><a href="https://discord.com/" target="_blank" rel="noopener">Discord</a><a href="https://telegram.org/" target="_blank" rel="noopener">Telegram</a></div>'
          new='<div class="project-links"><a href="stats.html">Yamal Tracker</a><a href="match-reports.html">Match Reports</a><a href="biography.html">Biography</a><a href="match-centre.html">Match Centre</a><a href="privacy.html">Privacy</a><a href="credits.html">Credits &amp; sources</a><a href="https://github.com/pennyattah/Lamine-Yamal-Fanbase" target="_blank" rel="noopener">GitHub</a></div>'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit source-level SEO fixes
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage source already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize homepage crawler metadata and publication links"
          git push origin HEAD:ly10-publication-upgrades
