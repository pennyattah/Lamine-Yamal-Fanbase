name: Refresh LY10 live match data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ly10-live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh live feed
        run: node scripts/update-live-data.mjs
      - name: Publish only when data changed
        shell: bash
        run: |
          if git diff --quiet -- live-data.json; then
            echo 'No live-data change.'
            exit 0
          fi
          git config user.name 'ly10-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-data.json
          git commit -m 'Auto-refresh live match data'
          git pull --rebase origin main
          git push origin HEAD:main
